name: ai-classroom-foundation

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      APP_LOG_LEVEL: info
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  agent-check:
    profiles: ["tools"]
    build:
      context: ./apps/agent
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
    # A one-shot configuration check, not a running AI worker.
    restart: "no"
