name: Publish AInote to Firebase Hosting

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: hackathon-7314b
      REGION: asia-northeast1
      SERVICE: ainote-web
      IMAGE: asia-northeast1-docker.pkg.dev/hackathon-7314b/ainote-public/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Build the merged Web application
        run: docker build -f apps/web/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/716062584747/locations/global/workloadIdentityPools/ainote-github/providers/github-main
          service_account: ainote-publisher@hackathon-7314b.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy the image to Cloud Run
        run: |
          if [[ "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer commit is on main. Deploy that run instead."
            exit 1
          fi
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          [[ "$digest" == "$IMAGE"@sha256:* ]]
          service_url=$(gcloud run services update "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --image="$digest" --quiet --format='value(status.url)')
          node scripts/check-public-web.mjs "$service_url"
      - name: Publish the verified revision to the existing Hosting site
        run: npx --yes firebase-tools@15.35.0 deploy --only hosting --project "$PROJECT_ID" --non-interactive
      - name: Check the published site
        run: |
          for attempt in 1 2 3 4; do
            if node scripts/check-public-web.mjs "https://$PROJECT_ID.web.app"; then exit 0; fi
            if [[ $attempt -lt 4 ]]; then sleep 5; fi
          done
          exit 1
